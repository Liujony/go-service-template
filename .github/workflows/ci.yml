name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - name: coverage
        run: |
          go test -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - run: go build -trimpath ./...
